name: Deploy Vite app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
      VITE_GOOGLE_AI_MODEL: ${{ vars.VITE_GOOGLE_AI_MODEL }}
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
      VITE_FIRESTORE_CACHE_MODE: ${{ vars.VITE_FIRESTORE_CACHE_MODE || 'memory' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify the 13-application ecosystem with standalone Question Studio
        run: npm run test:catalog

      - name: Verify all 10 Question Engine scoring modes
        run: npm run test:question-engine

      - name: Verify head-tilt question generation
        run: npm run test:head-shake

      - name: Verify student exam portal
        run: npm run test:student-portal

      - name: Verify encrypted exams and isolation across 5000 teacher workspaces
        run: npm run test:exam-privacy

      - name: Verify Google Gemini and school counseling fallbacks
        run: npm run test:ai-services

      - name: Verify privacy-safe homepage community statistics
        run: npm run test:platform-metrics

      - name: Verify local-first scalability and static deployment
        run: npm run test:scalability

      - name: Verify teacher data isolation and administrator oversight
        run: npm run test:teacher-isolation

      - name: Verify shared-device, OMR, wall and guest-write hardening
        run: npm run test:hardening

      - name: Verify owner-scoped Plicker class and student synchronization
        run: npm run test:plicker-student-sync

      - name: Validate Firebase owner-scoped security rules
        run: npm run lint:firestore

      - name: Verify account-switch privacy and restricted student submissions
        run: npm run test:security-hardening

      - name: Verify ecosystem and Plicker offline installation
        run: npm run test:pwa

      - name: Verify private browser-based PDF splitting and merging
        run: npm run test:pdf

      - name: Build project
        run: npm run build

      - name: Deploy named-database Firestore rules when credentials are available
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/smartclass-firebase-service-account.json
        shell: bash
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::warning::Firestore rules were not published. Configure FIREBASE_SERVICE_ACCOUNT_JSON or publish firestore.rules in Firebase Console."
            exit 0
          fi

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npm run deploy:firestore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
