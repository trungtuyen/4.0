name: One-time Plicker Pro auto-pair upgrade

on:
  push:
    branches:
      - feat/plicker-pro-autopair
    paths:
      - .github/workflows/one-time-plicker-pro-autopair.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Pro auto-pair upgrade
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} anchor count = {text.count(old)}')
              return text.replace(old, new, 1)

          live_path = Path('src/lib/plickerLive.ts')
          live = live_path.read_text(encoding='utf-8')
          live = replace_once(
              live,
              "const MAX_CARD_ID = 63;\n",
              "const MAX_CARD_ID = 63;\n\n"
              "export const PLICKER_DEVICE_HEARTBEAT_MS = 120_000;\n"
              "export const PLICKER_DEVICE_STALE_MS = 300_000;\n\n"
              "export function isPlickerDeviceOnline(\n"
              "  device: PlickerLiveDevice | null | undefined,\n"
              "  now = Date.now(),\n"
              "  staleMs = PLICKER_DEVICE_STALE_MS,\n"
              "): boolean {\n"
              "  return Boolean(\n"
              "    device?.deviceId &&\n"
              "    Number.isFinite(device.updatedAt) &&\n"
              "    device.updatedAt > 0 &&\n"
              "    Number.isFinite(staleMs) &&\n"
              "    staleMs > 0 &&\n"
              "    now - device.updatedAt <= staleMs,\n"
              "  );\n"
              "}\n",
              'MAX_CARD_ID',
          )
          live_path.write_text(live, encoding='utf-8')

          path = Path('src/components/PlickerClassroom.tsx')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';\n",
              "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';\nimport QRCode from 'qrcode';\n",
              'React import',
          )
          text = replace_once(
              text,
              "  getPlickerOrphanedRosterChanges,\n  isPlickerLiveSessionRunning,\n",
              "  getPlickerOrphanedRosterChanges,\n  isPlickerDeviceOnline,\n  isPlickerLiveSessionRunning,\n  PLICKER_DEVICE_HEARTBEAT_MS,\n",
              'plickerLive imports',
          )
          text = replace_once(
              text,
              "function createIdentifier(prefix: string): string {\n  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;\n}\n",
              "function createIdentifier(prefix: string): string {\n  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;\n}\n\n"
              "function getOrCreatePlickerDeviceId(ownerUid: string, role: PlickerDeviceRole): string {\n"
              "  const storageKey = `smartclass_plicker_device_v1_${ownerUid || 'guest'}_${role}`;\n"
              "  try {\n"
              "    const saved = localStorage.getItem(storageKey);\n"
              "    if (saved && /^[a-zA-Z0-9_-]{1,120}$/u.test(saved)) return saved;\n"
              "    const created = createIdentifier(`device-${role}`);\n"
              "    localStorage.setItem(storageKey, created);\n"
              "    return created;\n"
              "  } catch {\n"
              "    return createIdentifier(`device-${role}`);\n"
              "  }\n"
              "}\n",
              'createIdentifier',
          )
          text = replace_once(
              text,
              "  const [showPairingHelp, setShowPairingHelp] = useState(false);\n",
              "  const [showPairingHelp, setShowPairingHelp] = useState(false);\n  const [scannerQrCode, setScannerQrCode] = useState('');\n",
              'pairing state',
          )
          text = replace_once(
              text,
              "  const [isOnline, setIsOnline] = useState(navigator.onLine);\n",
              "  const [isOnline, setIsOnline] = useState(navigator.onLine);\n  const [presenceNow, setPresenceNow] = useState(Date.now());\n",
              'online state',
          )
          text = replace_once(
              text,
              "  const deviceIdRef = useRef(createIdentifier('device'));\n",
              "  const deviceIdRef = useRef(getOrCreatePlickerDeviceId(ownerUid, deviceRole));\n",
              'device id',
          )
          marker = "    const markOnline = () => setIsOnline(true);"
          text = replace_once(
              text,
              marker,
              "  useEffect(() => {\n"
              "    const timer = window.setInterval(() => setPresenceNow(Date.now()), 10_000);\n"
              "    return () => window.clearInterval(timer);\n"
              "  }, []);\n\n"
              "  useEffect(() => {\n"
              + marker,
              'online effect',
          )

          announce_pattern = re.compile(
              r"      void saveRoomFields\(\{\n\s+devices: \{\n\s+\[deviceRole\]: \{ deviceId: deviceIdRef\.current, updatedAt: Date\.now\(\) \},\n\s+\},\n\s+\}\);"
          )
          announce_replacement = (
              "      const device = { deviceId: deviceIdRef.current, updatedAt: Date.now() };\n"
              "      void saveRoomFields({\n"
              "        devices: {\n"
              "          ...(currentRoomRef.current?.devices || {}),\n"
              "          [deviceRole]: device,\n"
              "        },\n"
              "      });"
          )
          text, count = announce_pattern.subn(announce_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'announceDevice pattern matched {count}')

          text = replace_once(
              text,
              "const heartbeat = window.setInterval(announceDevice, 300_000);",
              "const heartbeat = window.setInterval(announceDevice, PLICKER_DEVICE_HEARTBEAT_MS);",
              'heartbeat',
          )
          text = replace_once(
              text,
              "      void publishLiveSession(session);\n      setNotice('Buổi học đã đồng bộ. Mở cùng tài khoản trên điện thoại và máy tính để quét và trình chiếu song song.');",
              "      void publishLiveSession(session);\n"
              "      if (deviceRole === 'display' && !isPlickerDeviceOnline(currentRoomRef.current?.devices.scanner, Date.now())) {\n"
              "        setShowPairingHelp(true);\n"
              "      }\n"
              "      setNotice('Buổi học đã sẵn sàng. Điện thoại cùng tài khoản sẽ tự nhận phiên; nếu là lần đầu, chỉ cần quét mã QR mở nhanh.');",
              'start session notice',
          )
          connected_old = (
              "  const scannerConnected = Boolean(liveRoom?.devices.scanner && Date.now() - liveRoom.devices.scanner.updatedAt < 120_000);\n"
              "  const displayConnected = Boolean(liveRoom?.devices.display && Date.now() - liveRoom.devices.display.updatedAt < 120_000);\n"
              "  const answerDistribution = summarizePlickerLiveAnswers(currentAnswers);\n"
              "  const scannerUrl = new URL(createPlickerDevicePath(import.meta.env.BASE_URL, 'scanner'), window.location.origin).toString();\n"
              "  const displayUrl = new URL(createPlickerDevicePath(import.meta.env.BASE_URL, 'display'), window.location.origin).toString();"
          )
          connected_new = (
              "  const scannerConnected = isPlickerDeviceOnline(liveRoom?.devices.scanner, presenceNow);\n"
              "  const displayConnected = isPlickerDeviceOnline(liveRoom?.devices.display, presenceNow);\n"
              "  const answerDistribution = summarizePlickerLiveAnswers(currentAnswers);\n"
              "  const scannerUrlObject = new URL(createPlickerDevicePath(import.meta.env.BASE_URL, 'scanner'), window.location.origin);\n"
              "  if (sessionInProgress) scannerUrlObject.searchParams.set('section', 'session');\n"
              "  const scannerUrl = scannerUrlObject.toString();\n"
              "  const displayUrl = new URL(createPlickerDevicePath(import.meta.env.BASE_URL, 'display'), window.location.origin).toString();\n\n"
              "  useEffect(() => {\n"
              "    let cancelled = false;\n"
              "    void QRCode.toDataURL(scannerUrl, { width: 220, margin: 1, errorCorrectionLevel: 'M' })\n"
              "      .then(dataUrl => {\n"
              "        if (!cancelled) setScannerQrCode(dataUrl);\n"
              "      })\n"
              "      .catch(error => {\n"
              "        console.error('Không thể tạo mã QR kết nối điện thoại:', error);\n"
              "        if (!cancelled) setScannerQrCode('');\n"
              "      });\n"
              "    return () => { cancelled = true; };\n"
              "  }, [scannerUrl]);"
          )
          text = replace_once(text, connected_old, connected_new, 'connected status')
          text = replace_once(
              text,
              "{scannerConnected && displayConnected ? 'Đã ghép 2 thiết bị' : 'Ghép điện thoại'}",
              "{scannerConnected && displayConnected ? '2 thiết bị đang online' : scannerConnected ? 'Điện thoại đã sẵn sàng' : 'Kết nối điện thoại'}",
              'pair button',
          )
          text = replace_once(
              text,
              '<div><h2 id="plicker-pairing-title" className="text-lg font-bold">Ghép điện thoại và màn hình máy tính</h2><p className="mt-1 text-sm text-slate-500">Đăng nhập cùng một tài khoản trên cả hai thiết bị.</p></div>',
              '<div><h2 id="plicker-pairing-title" className="text-lg font-bold">Kết nối điện thoại tự động</h2><p className="mt-1 text-sm text-slate-500">Cùng tài khoản là tự nhận phiên. QR chỉ dùng để mở nhanh trên điện thoại.</p></div>',
              'pair modal intro',
          )

          qr_anchor = '            <div className="mt-5 grid gap-4 sm:grid-cols-2">'
          qr_panel = '''            <section className="mt-5 grid gap-4 rounded-2xl border border-indigo-200 bg-gradient-to-br from-indigo-50 to-white p-4 sm:grid-cols-[auto_1fr] sm:items-center">
              <div className="mx-auto flex h-[220px] w-[220px] items-center justify-center overflow-hidden rounded-2xl border border-white bg-white shadow-sm">
                {scannerQrCode ? <img src={scannerQrCode} alt="Mã QR mở ứng dụng quét thẻ trên điện thoại" className="h-full w-full" /> : <LoaderCircle className="h-8 w-8 animate-spin text-indigo-500" />}
              </div>
              <div>
                <p className="text-xs font-semibold uppercase tracking-[0.16em] text-indigo-500">Mở nhanh một lần</p>
                <h3 className="mt-1 text-lg font-bold text-slate-900">Quét QR bằng camera điện thoại</h3>
                <p className="mt-2 text-sm leading-6 text-slate-600">Sau khi đăng nhập cùng tài khoản, điện thoại tự nhận lớp, bộ câu hỏi và buổi học đang chạy. Không nhập mã phòng, không chọn lại phiên.</p>
                <div className="mt-3 flex flex-wrap gap-2">
                  <a href={scannerUrl} className="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white"><Smartphone className="h-4 w-4" />Mở trên điện thoại này</a>
                  <button
                    type="button"
                    onClick={() => void navigator.clipboard.writeText(scannerUrl).then(() => setNotice('Đã sao chép liên kết mở nhanh trên điện thoại.')).catch(() => setNotice('Không thể sao chép tự động. Hãy dùng mã QR.'))}
                    className="inline-flex items-center gap-2 rounded-lg border border-indigo-200 bg-white px-3 py-2 text-xs font-semibold text-indigo-700"
                  ><Link2 className="h-4 w-4" />Sao chép liên kết</button>
                </div>
                <p className={`mt-3 text-xs font-semibold ${scannerConnected ? 'text-emerald-700' : 'text-amber-700'}`}>{scannerConnected ? '● Điện thoại đang online và đã tự ghép' : '○ Chưa thấy điện thoại — quét QR để mở nhanh'}</p>
              </div>
            </section>

            <div className="mt-4 grid gap-4 sm:grid-cols-2">'''
          text = replace_once(text, qr_anchor, qr_panel, 'QR panel')
          text = replace_once(
              text,
              'Mở ứng dụng PWA hoặc đường dẫn dưới đây, chọn lớp rồi nhấn “Bắt đầu quét”.',
              'Mở ứng dụng/PWA. Nếu máy tính đã bắt đầu buổi học, điện thoại sẽ tự vào đúng phiên và chỉ cần nhấn nút quét.',
              'scanner pairing copy',
          )
          text = replace_once(
              text,
              'Điện thoại điều khiển câu hỏi, quét thẻ, hiện đáp án và biểu đồ; máy tính cập nhật đồng thời từng học sinh đã trả lời.',
              'Khi cả hai thiết bị dùng cùng tài khoản, phiên học và trạng thái được đồng bộ tự động. Điện thoại là remote + scanner; máy tính tự trình chiếu và cập nhật kết quả theo thời gian thực.',
              'pairing footer copy',
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/test-plicker-live.ts')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              "  getPlickerLiveResponses,\n  isPlickerLiveSessionRunning,\n",
              "  getPlickerLiveResponses,\n  isPlickerDeviceOnline,\n  isPlickerLiveSessionRunning,\n  PLICKER_DEVICE_HEARTBEAT_MS,\n  PLICKER_DEVICE_STALE_MS,\n",
              'test imports',
          )
          device_tests = (
              "assert.equal(createPlickerDevicePath('/4.0/', 'scanner'), '/4.0/?app=plicker&role=scanner');\n"
              "assert.equal(createPlickerDevicePath('/4.0', 'display'), '/4.0/?app=plicker&role=display');\n"
          )
          test = replace_once(
              test,
              device_tests,
              device_tests
              + "assert.equal(PLICKER_DEVICE_HEARTBEAT_MS < PLICKER_DEVICE_STALE_MS, true);\n"
              + "assert.equal(isPlickerDeviceOnline(undefined, 1_000), false);\n"
              + "assert.equal(isPlickerDeviceOnline({ deviceId: 'phone', updatedAt: 950 }, 1_000, 100), true);\n"
              + "assert.equal(isPlickerDeviceOnline({ deviceId: 'phone', updatedAt: 800 }, 1_000, 100), false);\n",
              'device tests',
          )
          test = replace_once(test, 'checks += 14;', 'checks += 18;', 'early check count')
          source_anchor = 'assert.match(classroomSource, /onSnapshot\\(liveRoomReference/);'
          source_assertions = (
              "assert.match(classroomSource, /QRCode\\.toDataURL\\(scannerUrl/);\n"
              "assert.match(classroomSource, /PLICKER_DEVICE_HEARTBEAT_MS/);\n"
              "assert.match(classroomSource, /getOrCreatePlickerDeviceId/);\n"
              "assert.match(classroomSource, /isPlickerDeviceOnline/);\n"
              "checks += 4;\n"
              + source_anchor
          )
          test = replace_once(test, source_anchor, source_assertions, 'source assertions')
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify live pairing
        run: npm run test:plicker-live

      - name: Verify mobile scanner
        run: npm run test:plicker-mobile

      - name: Verify display
        run: npm run test:plicker-display

      - name: Verify PWA
        run: npm run test:pwa

      - name: Build static ecosystem
        run: npm run build:static

      - name: Commit Pro auto-pair upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/plickerLive.ts src/components/PlickerClassroom.tsx scripts/test-plicker-live.ts
          git commit -m "feat: automate Plicker companion pairing"
          git pull --rebase origin feat/plicker-pro-autopair
          git push origin HEAD:feat/plicker-pro-autopair
